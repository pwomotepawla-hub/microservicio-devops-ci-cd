version: '3.8'

services:

  app:
    build: .
    container_name: microservicio-devops

    ports:
      - "5000:5000"

    environment:
      - APP_ENV=production

    depends_on:
      - redis

    networks:
      - devops-network

    restart: always

    healthcheck:
      test: ["CMD", "python", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest

    container_name: redis-cache

    volumes:
      - redis-data:/data

    networks:
      - devops-network

    restart: always

networks:
  devops-network:

volumes:
  redis-data:
