name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: pytest

  docker:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t microservicio-devops .
      
      deploy:

    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Simular despliegue
        run: |
          echo "Desplegando aplicación..."
          echo "Deploy exitoso"
